# Minecraft Foods configuration example / 配置示例 / 設定例
# The actual settings.cfg is generated beside the plugin. This example is never loaded automatically.
# 实际 settings.cfg 在插件旁自动生成；本示例不会自动读取。
# 実際の settings.cfg はプラグイン横に生成。この例は自動読込されません。
# Edit the actual file, then use F10 > Reload file, or restart. / 修改实际文件后 F10 重新载入或重启。
# Loot changes affect future generation on the host; already generated contents are unchanged.
# 箱子设置仅房主决定后续掉落，已生成内容不变。 / 箱の設定はホストの今後の生成に適用。

[UI]

## Auto 跟随游戏；zh-CN 中文，en 英语，ja 日语。
## Auto follows the game; zh-CN, en, ja force a language.
## Auto はゲームに従う。zh-CN/en/ja で固定。
Language = Auto

## 显示手持食品效果和烹饪增量。
## Show held-food information.
## 食品情報を表示。
ShowFoodInformation = true

## 额外显示烧焦和烧毁次数。
## Also show charring and destruction thresholds.
## 焦げ・燃え尽きの回数も表示。
DetailedFoodInformation = false

## 显示特殊效果倒计时。
## Show effect timers.
## 効果タイマーを表示。
ShowEffectTimers = true

[Effects]

## 机场内启用本模组食品状态。
## Allow food status effects in the airport.
## 空港内でも食品効果を有効化。
AllowFoodEffectsInAirport = true

## 金苹果无敌后睡意在6/12秒内逐渐升满，实际入睡后维持6/12秒。false 取消待触发和进行中的后遗症。
## Raise drowsiness to maximum over 6/12s after apple invincibility, then maintain sleep for 6/12s from actual unconsciousness. false cancels pending/active ramps.
## 無敵終了後、6/12秒かけて眠気が最大まで上昇し、入眠後6/12秒維持。falseで保留中・進行中の反動を中止。
GoldenAppleAftereffects = true

[Visuals]

## TrailMix 混合坚果 或 SmallEgg 小煎蛋；需重启。
## TrailMix or SmallEgg; restart required.
## TrailMix または SmallEgg。再起動が必要。
GripTemplate = TrailMix

